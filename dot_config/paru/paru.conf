# Fleet policy (see ~/.claude/CLAUDE.md → "Inspect AUR PKGBUILDs before installing"):
# always review PKGBUILDs before building. paru reviews by default — we simply
# never set SkipReview, and add UpgradeMenu so updated PKGBUILDs surface on
# sysupgrade too (the 2026-06-11 campaign landed largely via updates).
#
# NOTE: a user paru.conf REPLACES /etc/paru.conf (no merge), so the options
# below mirror the host's /etc/paru.conf and must be kept in parity with it.
[options]
PgpFetch
Devel
Provides
UpgradeMenu
NewsOnUpgrade
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
