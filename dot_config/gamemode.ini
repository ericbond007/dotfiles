# flattop — Feral GameMode config (RTX 3070 mobile / Ryzen 7 5800H, CachyOS)
# Activated per-game by prefixing the Steam launch command with `gamemoderun`.
# Fully reversible: delete this file, or drop `gamemoderun`, to revert.

[general]
# Pin the CPU governor to performance for the lifetime of the game, then
# restore the prior governor on exit. flattop already idles on `performance`,
# so this mainly guarantees nothing quietly drops it mid-session.
desiredgov=performance

# Raise the game's scheduling priority: renice=10 => the game runs at nice -10,
# so it wins CPU time against background work (browser, indexers, Claude).
renice=10

# Best-effort highest I/O priority for the game's threads — helps asset/area
# streaming hitches compete against background disk I/O.
ioprio=0

# NOTE: softrealtime (SCHED_ISO) removed — CachyOS's scheduler has no SCHED_ISO,
# so gamemode only logged a harmless error. renice/split-lock below also need
# gamemode's polkit helper to actually apply (currently log "not authorized");
# they're left as intent and are harmless if unprivileged.

# Don't let the screen blank during controller-only / couch sessions.
inhibit_screensaver=1

# --- GPU max-performance: handled GLOBALLY, not here ----------------------
# The GPU clock floor for ALL games is driven by the systemd --user service
# `gpu-gamemode-watch.service` (watches for any running Steam game and toggles
# /usr/local/bin/gpu-gamemode-perf). That covers every game with no per-game
# `gamemoderun`, so no [custom] hook is needed here.
# See ~/.local/bin/gpu-game-watch.sh.
