#!/bin/sh
# Co-manage ~/.codex/config.toml without overwriting Codex-managed settings.
# Codex updates project trust and TUI state at runtime. Enforce only the fleet
# defaults that should be identical on every Codex host, then preserve the rest.
set -eu

config=$(cat)

printf '%s\n' 'notify = ["/home/eric/.codex/notify-tmux.sh"]'
printf '%s\n' 'project_doc_fallback_filenames = ["CLAUDE.md"]'
printf '%s\n' "$config" | awk '
    BEGIN {
        in_root = 1
        in_features = 0
        saw_features = 0
    }
    /^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
        in_root = 0
        in_features = ($0 ~ /^[[:space:]]*\[features\][[:space:]]*$/)
        if (in_features) {
            saw_features = 1
            print
            print "memories = true"
            next
        }
    }
    in_root && $0 ~ /^[[:space:]]*(notify|project_doc_fallback_filenames)[[:space:]]*=/ { next }
    in_features && $0 ~ /^[[:space:]]*memories[[:space:]]*=/ { next }
    { print }
    END {
        if (!saw_features) {
            print ""
            print "[features]"
            print "memories = true"
        }
    }
'
