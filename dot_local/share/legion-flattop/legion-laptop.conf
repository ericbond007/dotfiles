# Force legion-laptop to load on this Lenovo Legion 7 16ACHg6 (BIOS GKCN65WW).
# `force=1` bypasses the upstream-broken VPC0._CFG ACPI path check — the
# second half of the upstream TODO whose first half (the alias) we patched
# in DKMS via /usr/local/sbin/legion-vpc2004-patch.sh.
options legion-laptop force=1
