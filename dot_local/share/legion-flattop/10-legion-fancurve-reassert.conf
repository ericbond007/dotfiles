# power-profiles-daemon asserts a platform_profile (~7 ms) every time it starts,
# which writes powermode=1/2/3 and destroys custom mode 255 + our fan curve.
#
# PPD is Type=dbus and NOT enabled, so it is D-Bus-activated by powerdevil at
# session start -- i.e. it is NOT in the boot transaction. That makes the
# "After=power-profiles-daemon.service" in legion-fancurve-ac.service a no-op:
# that unit ran at 17:21:03 (udev/AC), PPD did not start until 17:21:16, and
# the curve was silently lost for the whole session (2026-08-28 incident).
#
# Fix: re-assert from PPD's OWN startup, so it fires whenever PPD actually
# starts, however it was started. --no-block avoids a start-job deadlock.
#
# 2026-10-09: legion-profile-watch subscribes to PPD's signals WITHOUT
# D-Bus-activating it, so PPD is still started by powerdevil at login. That
# daemon's 5 s powermode poll is a second net for this startup write.
[Service]
ExecStartPost=-/usr/bin/systemctl start --no-block legion-fancurve-ac.service
